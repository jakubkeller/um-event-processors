parameters:
- name: tpl_clean
  type: boolean
  default: true

- name: tpl_Postclean
  type: boolean
  default: true

- name: tpl_displayName
  type: string
  default: ''

- name: tpl_projectKey
  type: string
  default: ''

- name: tpl_projectName
  type: string
  default: ''

- name: tpl_projectExtraProperties
  type: string
  default: ''

- name: tpl_orgName
  type: string
  default: 'navitus'

stages:
- stage: Build
  displayName: 'Application Build and Artifact Drop'
  jobs:
  - job: Build
    displayName: '${{parameters.tpl_displayName}}'
    # clean: true --> Defaults to "All build directories"
    workspace:
      clean: ${{parameters.tpl_clean}}
    pool:
      name: $(AGENT_POOL)
    steps:

    # Pre-clean agent
    - script: |
        docker system prune -a -f 2>/dev/null || true
        dotnet nuget locals --clear all 2>/dev/null || true
        echo "Agent Tool directory"
        echo "==============================="
        rm -fr $(Agent.ToolsDirectory)/* || true
        echo ""
        echo "Agent Temp directory"
        echo "==============================="
        rm -fr $(Agent.TempDirectory)/* || true
      displayName: 'Give me a clean start'

    # Checkout code
    - checkout: self
      fetchDepth: 1

    # Display environment variables
    - script: |
        echo "Environment variables"
        echo "====================="
        env | sort
      displayName: 'Display Environment Variables'

    # SonarCloud Prep - Run Before Build
    - template: /security/sonarCloudPrepareMSBuildScanner.yml@templates
      parameters:
        sonarProjectKey: '${{parameters.tpl_projectKey}}'
        sonarProjectName: '${{parameters.tpl_projectName}}'
        sonarOrgName: '${{ parameters.tpl_orgName }}'
        # sonarExtraProperties: '${{parameters.tpl_projectExtraProperties}}' - Not needed by default. See vars-global.yaml

    - task: UseDotNet@2
      displayName: 'Use .NET Core sdk'
      inputs:
        version: $(DOTNET_VERSION)

    # Build app and infra, including test projects.
    # '$(LOCAL_PATH)/**/*.csproj' will find  find csproj files not in the .sln file, but build time increases significantly.
    # Instead, ensure the .sln file has all the csproj files or possibly create a new one.
    #   - dotnet new sln -n [solution name w/o .sln extension]
    #   - dotnet sln [solution name].sln add $(find . -regextype posix-extended -regex ".*\.csproj")
    - task: DotNetCoreCLI@2
      displayName: 'Build Solutions'
      inputs:
        command: 'build'
        projects: '$(LOCAL_PATH)/**/*.sln'
        arguments: '--configuration "$(CONFIGURATION)"' # Add -warnaserror if sonarqube gets down to zero warnings. This will cause a build failure if there are warnings
        workingDirectory: '$(LOCAL_PATH)'

    # Run unit tests
    # The --output argument cannot be used on a solution file, but --results-directory can be used to specificy where the result files (.trx) are placed.
    - task: DotNetCoreCLI@2
      displayName: 'Unit Test Solutions'
      inputs:
        command: test
        projects: '$(LOCAL_PATH)/**/*.sln'
        arguments: '--logger "trx" --no-build --settings $(CODECOVERAGE_SETTINGS_PATH)/CodeCoverage.runsettings --collect "XPlat Code coverage" --configuration $(CONFIGURATION)'
        workingDirectory: '$(LOCAL_PATH)'

    # Merge Code Coverage Reports
    - task: reportgenerator@5
      displayName: 'Merge code coverage reports'
      inputs:
        reports: '$(TESTRESULT_PATH)/**/coverage.cobertura.xml'
        targetdir: '$(TESTRESULT_PATH)/mergedCoverageReport'
        reporttypes: 'Cobertura'
        verbosity: 'Verbose'

    # Publish Test Results
    - task: PublishTestResults@2
      displayName: Publish Test Results
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '*.trx'
        searchFolder: '$(TESTRESULT_PATH)'
        testRunTitle: '$(Build.BuildId) Test'
        workingDirectory: ''

    # Publish Code Coverage Report
    - task: PublishCodeCoverageResults@2
      displayName: 'Publish code coverage results from $(TESTRESULT_PATH)/mergedCoverageReport/Cobertura.xml'
      inputs:
        summaryFileLocation: '$(TESTRESULT_PATH)/mergedCoverageReport/**/*'
        pathToSources: '$(TESTRESULT_PATH)/mergedCoverageReport/'
        failIfCoverageEmpty: true

    # SonarCloud Code Analysis and Publish - Run after build, test, and code coverage/test result publishing. 
    - template: /security/sonarCloudAnalyzeAndPublish.yml@templates

    # Dotnet publish
    # We do not publish the .sln file because the --output argument cannot be used. We also do not need to publish the infra stack(s)
    # Building and testing the .sln files while publishing the .csproj files is a recommended pattern.
    - task: DotNetCoreCLI@2
      inputs:
        command: publish
        publishWebProjects: false
        projects: '$(LOCAL_PATH)/app/src/**/*.csproj'
        arguments: '--configuration $(CONFIGURATION) --no-build --runtime linux-x64 --self-contained false --output $(PUBLISH_PATH)'
        zipAfterPublish: false
        modifyOutputPath: true
        workingDirectory: $(LOCAL_PATH)
      displayName: 'Publish App'

    # Run CDK Synth Script
    - task: ShellScript@2
      displayName: 'CDK Synth'
      inputs:
        arguments: ''
        scriptPath: '$(SCRIPTS_PATH)/synth.sh'
        disableAutoCwd: true

    # Run WizCLI scans
    - template: /security/wizCLI.yml@templates

    # Delete unnecessary files
    - task: DeleteFiles@1
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
      displayName: "Remove unnecessary files"
      inputs:
        contents: |
          **/bin/**
          **/obj/**
          **/cdk.out/**
          **/node_modules/**
          **/.venv/**
        removeDotFiles: true

    # Copy application files to artifact staging location
    - task: CopyFiles@2
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
      displayName: 'Stage Build Artifacts'
      inputs:
        SourceFolder: '$(LOCAL_PATH)'
        Contents: |
          **/dist/**
          **/scripts/**
          **/infra/src/**/*.cs
          **/infra/src/**/*.csproj
          **/infra/cdk.json
          global.json
        TargetFolder: '$(ARTIFACTSTAGING_PATH)/'
        CleanTargetFolder: true

    # Run Zip Artifact
    - task: ArchiveFiles@2
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
      displayName: Zip Artifact
      inputs:
        rootFolderOrFile: '$(ARTIFACTSTAGING_PATH)/'
        includeRootFolder: true
        archiveType: 'zip'
        archiveFile: '$(ARTIFACTSTAGING_PATH)/dotnetapp/$(Build.BuildId).zip'
        replaceExistingArchive: true'

    # Publish build artifact
    - task: PublishBuildArtifacts@1
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
      displayName: 'Publish Build Artifact'
      inputs:
        PathtoPublish: '$(ARTIFACTSTAGING_PATH)/dotnetapp'
        ArtifactName: DotnetApp

    # Post Build Clean-up
    - ${{ if eq(parameters.tpl_Postclean, true) }}:
      - template: /cleanup/postBuildClean-up.yml@templates
