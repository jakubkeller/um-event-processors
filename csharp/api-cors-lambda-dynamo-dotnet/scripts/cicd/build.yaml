# /pipeline-examples/csharp/api-cors-lambda-dynamo-dotnet/scripts/cicd/build.yaml

# =======================================================
# See README.md for links and callouts about
# ADO triggers, filters, and variable definitions.
# =======================================================

# NOTE: Main is built to retain artifacts and code coverage reports; however, this build occurs after the deploy of a release branch to production.

trigger:
  branches:
    include:
    - main
    - develop
    - release/*
    - bug/*
    - hotfix/*

  paths:
    include:
    - pipeline-examples/csharp

resources:
  repositories:
  - repository: templates
    type: git
    name: ado-pipeline-templates

variables:
- template: vars/vars-global.yaml
  parameters:
    tpl_type: 'Build'

# Runtime parameters for manual pipeline execution can only be defined in the main pipeline.yaml, not templates.
parameters:
- name: clean
  displayName: Clean agent working directory on checkout
  type: boolean
  default: true
  values:
  - false
  - true
- name: Postclean
  displayName: Post Completion Clean-up
  type: boolean
  default: true
  values:
  - false
  - true
- name: centralTemplate
  displayName: Use Central Template
  type: boolean
  default: true
  values:
  - false
  - true

stages:
- ${{ if eq(parameters.centralTemplate, false) }}:
  - template: _template-build.yaml
    parameters:
      tpl_clean: ${{parameters.clean}}
      tpl_Postclean: ${{parameters.Postclean}}
      tpl_displayName: "Build ${{ variables['Build.SourceBranch'] }}"
      tpl_projectKey: $(SONAR_PROJECT_KEY)
      tpl_projectName: $(SONAR_PROJECT_NAME)
      tpl_orgName: $(SONAR_ORG_NAME)
      # tpl_projectExtraProperties: $(SONAR_EXTRA_PROPERTIES) - Not needed by default. See vars-global.yaml

- ${{ if eq(parameters.centralTemplate, true) }}:
  - template: /dotnet/dotnetBuild.yml@templates
    parameters:
      tpl_clean: ${{parameters.clean}}
      tpl_Postclean: ${{parameters.Postclean}}
      tpl_displayName: "Build ${{ variables['Build.SourceBranch'] }}"
      tpl_projectKey: $(SONAR_PROJECT_KEY)
      tpl_projectName: $(SONAR_PROJECT_NAME)
      tpl_orgName: $(SONAR_ORG_NAME)
      # tpl_projectExtraProperties: $(SONAR_EXTRA_PROPERTIES) - Not needed by default. See vars-global.yaml
