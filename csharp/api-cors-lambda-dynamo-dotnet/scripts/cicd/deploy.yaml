# /pipeline-examples/csharp/api-cors-lambda-dynamo-dotnet/scripts/cicd/deploy.yaml

# =======================================================
# See README.md for links and callouts about
# ADO triggers, filters, and variable definitions.
# =======================================================

trigger: none # Do not trigger on commits to a branch.

# Main is not included in branch triggers for gitflow. Release branches are deployed to production.

resources:
  repositories:
  - repository: templates
    type: git
    name: ado-pipeline-templates

  pipelines:
  - pipeline: dotnetApp # unique value that you can use to reference the pipeline resource later in this pipeline
    source: csharp-dotnet-example-build # the source pipeline that produces an artifact
    project: NUCLEUS
    trigger:
      branches:
        include:
        - develop
        - feature/*
        - release/*

variables:
- template: vars/vars-global.yaml
  parameters:
    tpl_type: 'Deploy'

# ============================================
# See README.md Environment approvals section
# ============================================
stages:
# Sandbox environment / Feature branches
- template: _template-deploy.yaml
  parameters:
    tpl_Enabled: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/') }}
    tpl_Environment: "sandbox"

# Development environment / develop branch
- template: _template-deploy.yaml
  parameters:
    tpl_Enabled: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}
    tpl_Environment: "development"

# Test environment / release branches
- template: _template-deploy.yaml
  parameters:
    tpl_Enabled: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/release/') }}
    tpl_Environment: "test"

# Stage environment / release branches
- template: _template-deploy.yaml
  parameters:
    tpl_Enabled: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/release/') }}
    tpl_Environment: "stage"

# Production environment / release branches
- template: _template-deploy.yaml
  parameters:
    tpl_Enabled: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/release/') }}
    tpl_Environment: "production"
