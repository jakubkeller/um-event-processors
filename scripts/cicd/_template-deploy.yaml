parameters:
- name: tpl_Enabled
  type: boolean
  default: false
- name: tpl_Environment
  type: string
  default: ''
- name: tpl_DependsOn
  type: string
  default: ''

stages:
- stage: "Deploy_${{ parameters.tpl_Environment }}"
  displayName: "Deploy to ${{ parameters.tpl_Environment }} : ${{ variables.SERVICE_CONNECTION }}"
  condition: and(succeeded(), eq('${{ parameters.tpl_Enabled }}', true))
  ${{ if parameters.tpl_DependsOn }}:
    dependsOn: "Deploy_${{ parameters.tpl_DependsOn }}"
  variables:
  - template: vars/vars-${{ parameters.tpl_Environment }}.yaml
  jobs:
  - ${{ if or(eq(variables['parameters.tpl_environment'], 'stage'), eq(variables['parameters.tpl_enironment'], 'prod')) }}:
    - job: PausePipeline
      pool: server
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 1440
        inputs:
          notifyUsers: ${{ variables.pauseNotify }}
          instructions: 'Please resume the release in order to proceed.'
          onTimeout: 'timed out waiting for manual resume'

  - deployment: "Deploy_${{ parameters.tpl_Environment }}"
    ${{ if or(eq(variables['parameters.tpl_environment'], 'stage'), eq(variables['parameters.tpl_enironment'], 'prod')) }}:
      dependsOn: PausePipeline
    displayName: "Deploy to ${{ variables.SERVICE_CONNECTION }}"
    workspace:
      clean: all
    environment: ${{ variables.SERVICE_CONNECTION }}
    pool:
      name: $(AGENT_POOL)
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "Environment variables"
              echo "====================="
              env | sort
            displayName: 'Display Environment Variables'

          - task: ExtractFiles@1
            inputs:
              archiveFilePatterns: '$(PIPELINE.WORKSPACE)/$(RESOURCE_PIPELINE_NAME)/**/*.zip'
              destinationFolder: '$(PIPELINE.WORKSPACE)/$(RESOURCE_PIPELINE_NAME)/$(ARTIFACT_NAME)'
              cleanDestinationFolder: false
              overwriteExistingFiles: true
            displayName: 'Extract Zipped Artifact'

          - task: AWSShellScript@1
            displayName: "CDK Synth"
            inputs:
              awsCredentials: ${{ variables.SERVICE_CONNECTION }}
              regionName: $(REGION_NAME)
              scriptType: filePath
              filePath: '$(INFRA_SCRIPTS_PATH)/synth.sh'
              workingDirectory: "$(PIPELINE.WORKSPACE)/$(RESOURCE_PIPELINE_NAME)/$(ARTIFACT_NAME)"
              disableAutoCwd: true

          - task: AWSShellScript@1
            displayName: 'CDK Deploy'
            inputs:
              awsCredentials: ${{ variables.SERVICE_CONNECTION }}
              regionName: $(REGION_NAME)
              scriptType: filePath
              filePath: '$(INFRA_SCRIPTS_PATH)/deploy.sh'
              workingDirectory: "$(PIPELINE.WORKSPACE)/$(RESOURCE_PIPELINE_NAME)/$(ARTIFACT_NAME)"
              disableAutoCwd: true
